evolution:
  use-progression-formula:
    # =========================
    # Formula Priorities
    # =========================
    # 1. DEFAULT (lowest priority, global fallback)
    #    Used when no category or item-specific formula is found.
    DEFAULT: "({L} - 1)^(4/3) * {DUR}"

    # 2. ARMOR (low priority)
    #    Used when the item is an armor piece but has no more specific formula.
    ARMOR: "({L} - 1)^(4/3) * {DUR} * 0.25"

    # 3. CATEGORY DEFAULT (medium priority)
    #    Each armor category (helmet, chestplate, leggings, boots)
    #    can have its own default formula if no item-specific rule is found.
    HELMET:
      # DEFAULT (medium priority for helmets)
      # Used if the item is a helmet but has no item-specific formula.
      DEFAULT: "({L} - 1)^(4/3) * {DUR} * 0.25"

      # 4. ITEM-SPECIFIC FORMULA (highest priority)
      #    Applied only if the exact item is found here.
      DIAMOND_HELMET: "({L} - 1)^(4/3) * {DUR} * 0.25"

    CHESTPLATE:
      DIAMOND_CHESTPLATE: "({L} - 1)^(4/3) * {DUR} * 0.25"

    LEGGINGS:
      DIAMOND_LEGGINGS: "({L} - 1)^(4/3) * {DUR} * 0.25"

    BOOTS:
      DIAMOND_BOOTS: "({L} - 1)^(4/3) * {DUR} * 0.25"

