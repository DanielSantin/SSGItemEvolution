# ========================================
# CONFIGURAÇÃO DE ENCANTAMENTOS VISUAIS
# ========================================
# Define quais encantamentos alteram o modelo 3D do item
#
# Formato:
# enchantment_key:
#   MATERIAL: "namespace:model_path"
#
# Vantagens:
# - Flexibilidade total para customizar cada modelo
# - Suporte para diferentes namespaces (não só supera:)
# - Fácil de adicionar modelos de outros resource packs
# ========================================

visual_enchantments:
  # Mineração em Área - Transforma a ferramenta em martelo
  "supera:area_mining":
    NETHERITE_PICKAXE: "supera:netherite_hammer"
    DIAMOND_PICKAXE: "supera:diamond_hammer"
    IRON_PICKAXE: "supera:iron_hammer"
    GOLDEN_PICKAXE: "supera:golden_hammer"
    STONE_PICKAXE: "supera:stone_hammer"
    WOODEN_PICKAXE: "supera:wooden_hammer"

    #NETHERITE_AXE: "supera:netherite_hammer"
    #DIAMOND_AXE: "supera:diamond_hammer"
    #IRON_AXE: "supera:iron_hammer"
    #GOLDEN_AXE: "supera:golden_hammer"
    #STONE_AXE: "supera:stone_hammer"
    #WOODEN_AXE: "supera:wooden_hammer"

    #NETHERITE_SHOVEL: "supera:netherite_hammer"
    #DIAMOND_SHOVEL: "supera:diamond_hammer"
    #IRON_SHOVEL: "supera:iron_hammer"
    #GOLDEN_SHOVEL: "supera:golden_hammer"
    #STONE_SHOVEL: "supera:stone_hammer"
    #WOODEN_SHOVEL: "supera:wooden_hammer"

    #NETHERITE_HOE: "supera:netherite_hammer"
    #DIAMOND_HOE: "supera:diamond_hammer"
    #IRON_HOE: "supera:iron_hammer"
    #GOLDEN_HOE: "supera:golden_hammer"
    #STONE_HOE: "supera:stone_hammer"
