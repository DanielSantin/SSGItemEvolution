  # Exemplos de futuros encantamentos visuais:
  # "supera:vein_miner":
  #   DIAMOND_PICKAXE: "custom:diamond_drill"
  #   IRON_PICKAXE: "custom:iron_drill"

  # "supera:tree_chopper":
  #   DIAMOND_AXE: "tools:diamond_chainsaw"
  #   IRON_AXE: "tools:iron_chainsaw"

# ========================================
# NOTAS IMPORTANTES
# ========================================
# 1. Os modelos devem existir no resource pack do servidor
# 2. Você pode usar qualquer namespace: supera:, minecraft:, custom:, etc
# 3. Se um material não estiver listado, o encantamento não terá efeito visual
# 4. Durante upgrades, o sistema busca automaticamente o modelo do novo material
# 5. Modelos são preservados durante reparos
# ========================================

# ========================================
# EXEMPLOS DE USO
# ========================================
# Usando modelos do Minecraft vanilla:
#   DIAMOND_PICKAXE: "minecraft:diamond_pickaxe"
#
# Usando modelos de outro resource pack:
#   IRON_PICKAXE: "mythic:legendary_pickaxe"
#
# Misturando namespaces:
#   NETHERITE_PICKAXE: "supera:netherite_hammer"
#   DIAMOND_PICKAXE: "custom:diamond_drill"
# ========================================